<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wayfinder · AI Trip Planner &amp; Budget Tracker</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="brand"><img src="assets/img/logo.svg" alt="" width="32" height="32"><span>Wayfinder</span><small>AI trip planner</small></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="plan" class="active">① Plan</button>
      <button role="tab" data-tab="itinerary">② Itinerary</button>
      <button role="tab" data-tab="budget">③ Budget</button>
      <button role="tab" data-tab="expenses">④ Expenses</button>
      <button role="tab" data-tab="live">⑤ Live alerts</button>
      <button role="tab" data-tab="saved">⑥ Saved &amp; export</button>
    </nav>
  </header>

  <div id="summary" class="summary" hidden></div>

  <main id="main">
    <section id="tab-plan" class="panel"></section>
    <section id="tab-itinerary" class="panel" hidden></section>
    <section id="tab-budget" class="panel" hidden></section>
    <section id="tab-expenses" class="panel" hidden></section>
    <section id="tab-live" class="panel" hidden></section>
    <section id="tab-saved" class="panel" hidden></section>
  </main>

  <footer class="foot">Wayfinder · Plan smarter, spend wiser</footer>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/disruptions.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
